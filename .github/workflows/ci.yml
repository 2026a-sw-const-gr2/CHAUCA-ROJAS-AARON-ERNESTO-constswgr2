name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build and Test  # 👈 Este nombre es el que busca el Ruleset
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GestionDeTareas/epn-event-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test --if-present
