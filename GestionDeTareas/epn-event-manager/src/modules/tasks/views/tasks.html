<!doctype html>
<!--
  Problema 12 — Mantenimiento Perfectivo
  Qué: Vista de la interfaz de usuario para gestión de tareas.
  Por qué: El HTML, CSS y JS estaban incrustados directamente en tasks.controller.ts,
           mezclando lógica de presentación con lógica de negocio.
  Mejora: Separar la capa de presentación hacia este archivo independiente
          permite editar la UI sin tocar el controlador, mejorando la mantenibilidad.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion de Tareas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f7f7f7; color: #222; }
    h1 { margin-top: 0; }
    form, table { background: #fff; border: 1px solid #ddd; border-radius: 4px; }
    form { padding: 16px; margin-bottom: 20px; display: grid; gap: 10px; max-width: 720px; }
    label { font-weight: bold; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #bbb; border-radius: 3px; }
    textarea { min-height: 70px; }
    button { padding: 8px 12px; border: 1px solid #777; border-radius: 3px; background: #eee; cursor: pointer; }
    button:hover { background: #e2e2e2; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
    th { background: #efefef; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .message { margin-bottom: 12px; min-height: 20px; }
    .filters { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 16px; margin-bottom: 20px; display: flex; gap: 16px; flex-wrap: wrap; max-width: 720px; }
    .filters > div { flex: 1; min-width: 200px; }
  </style>
</head>
<body>
  <h1>Gestion de Tareas</h1>
  <div id="message" class="message"></div>

  <form id="taskForm">
    <input type="hidden" id="taskId">
    <div>
      <label for="titulo">Titulo</label>
      <input id="titulo" required>
    </div>
    <div>
      <label for="descripcion">Descripcion</label>
      <textarea id="descripcion"></textarea>
    </div>
    <div>
      <label for="estado">Estado</label>
      <select id="estado">
        <option value="pendiente">pendiente</option>
        <option value="en progreso">en progreso</option>
        <option value="completada">completada</option>
      </select>
    </div>
    <div class="actions">
      <button type="submit">Guardar</button>
      <button type="button" onclick="clearForm()">Nuevo</button>
    </div>
  </form>

  <div class="filters">
    <div>
      <label for="searchInput">Buscar por titulo</label>
      <input id="searchInput" type="text" placeholder="Buscar por titulo...">
    </div>
    <div>
      <label for="statusFilter">Filtrar por estado</label>
      <select id="statusFilter">
        <option value="">Todos los estados</option>
        <option value="pendiente">pendiente</option>
        <option value="en progreso">en progreso</option>
        <option value="completada">completada</option>
      </select>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Titulo</th>
        <th>Descripcion</th>
        <th>Estado</th>
        <th>Fecha creacion</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tasksBody"></tbody>
  </table>

  <script>
    const form = document.getElementById('taskForm');
    const message = document.getElementById('message');
    const tasksBody = document.getElementById('tasksBody');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const SEARCH_DEBOUNCE_MS = 300;

    let allTasks = [];
    let searchDebounceTimer;

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const id = document.getElementById('taskId').value;
      const data = {
        titulo: document.getElementById('titulo').value,
        descripcion: document.getElementById('descripcion').value,
        estado: document.getElementById('estado').value
      };
      const url = id ? '/tasks/' + id : '/tasks';
      const method = id ? 'PUT' : 'POST';

      try {
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          showMessage(await getErrorMessage(response), true);
          return;
        }

        clearForm();
        showMessage('Tarea guardada');
        loadTasks();
      } catch (error) {
        showMessage('No se pudo conectar con el servidor. Intenta nuevamente.', true);
      }
    });

    async function loadTasks() {
      try {
        const response = await fetch('/tasks');

        if (!response.ok) {
          showMessage(await getErrorMessage(response), true);
          return;
        }

        allTasks = await response.json();
        applyFilters();
      } catch (error) {
        showMessage('No se pudo conectar con el servidor. Intenta nuevamente.', true);
      }
    }

    function filterTasks() {
      const term = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;

      return allTasks.filter((task) => {
        const matchesTitle = !term || task.titulo.toLowerCase().includes(term);
        const matchesStatus = !status || task.estado === status;
        return matchesTitle && matchesStatus;
      });
    }

    function applyFilters() {
      renderTasks(filterTasks());
    }

    function renderTasks(tasks) {
      tasksBody.innerHTML = '';

      tasks.forEach((task) => {
        const row = document.createElement('tr');
        row.innerHTML = '<td>' + task.id + '</td>'
          + '<td>' + escapeHtml(task.titulo) + '</td>'
          + '<td>' + escapeHtml(task.descripcion || '') + '</td>'
          + '<td>' + escapeHtml(task.estado) + '</td>'
          + '<td>' + escapeHtml(task.fecha_creacion) + '</td>'
          + '<td class="actions">'
          + '<button type="button" onclick="editTask(' + task.id + ')">Editar</button>'
          + '<button type="button" onclick="deleteTask(' + task.id + ')">Eliminar</button>'
          + '</td>';
        tasksBody.appendChild(row);
      });
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(applyFilters, SEARCH_DEBOUNCE_MS);
    });

    statusFilter.addEventListener('change', applyFilters);

    function editTask(id) {
      const task = allTasks.find((item) => item.id === id);
      if (!task) return;
      document.getElementById('taskId').value = task.id;
      document.getElementById('titulo').value = task.titulo;
      document.getElementById('descripcion').value = task.descripcion || '';
      document.getElementById('estado').value = task.estado;
    }

    async function deleteTask(id) {
      try {
        const response = await fetch('/tasks/' + id, { method: 'DELETE' });

        if (!response.ok) {
          showMessage(await getErrorMessage(response), true);
          return;
        }

        showMessage('Tarea eliminada');
        loadTasks();
      } catch (error) {
        showMessage('No se pudo conectar con el servidor. Intenta nuevamente.', true);
      }
    }

    function clearForm() {
      document.getElementById('taskId').value = '';
      form.reset();
    }

    function showMessage(text, isError) {
      message.textContent = text;
      message.style.color = isError ? '#b00020' : '';
      setTimeout(() => {
        message.textContent = '';
        message.style.color = '';
      }, 2500);
    }

    async function getErrorMessage(response) {
      try {
        const data = await response.json();
        if (data && (data.message || data.error)) {
          return data.message || data.error;
        }
      } catch (error) {
        // El cuerpo de la respuesta no es JSON o esta vacio; se usa el mensaje generico.
      }
      return 'Error ' + response.status + ': no se pudo completar la operacion.';
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    loadTasks();
  </script>
</body>
</html>
